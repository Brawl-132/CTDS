<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manual Backup</title>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap");

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Open Sans", sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100%;
      padding: 0 10px;
      position: relative;
      background-color: #eef1f5; /* fallback */
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-color: #2c3e50; /* dark blue background */
      opacity: 0.9;
      z-index: -1;
    }

    .navbar {
      width: 100%;
      padding: 1rem 2rem;
      position: absolute;
      top: 0;
      left: 0;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      text-align: left;
    }

    .navbar a {
      color: #fff;
      font-size: 1.5rem;
      font-weight: 700;
      text-decoration: none;
    }

    .wrapper {
      width: 400px;
      margin-top: 100px; /* space below navbar */
      border-radius: 12px;
      padding: 40px 30px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      text-align: center;
    }

    h2 {
      font-size: 2rem;
      margin-bottom: 25px;
      color: #fff;
    }

    p {
      font-size: 1rem;
      margin-bottom: 20px;
      color: #fff;
    }

    a.btn {
      display: inline-block;
      margin-top: 20px;
      background: #fff;
      color: #000;
      font-weight: 600;
      padding: 12px 20px;
      border-radius: 5px;
      font-size: 16px;
      border: 2px solid transparent;
      text-decoration: none;
      transition: 0.3s ease;
    }

    a.btn:hover {
      color: #fff;
      border-color: #fff;
      background: rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>
  <div class="navbar">
    <a href="/home">Home</a>
  </div>

  <div class="wrapper">
    <h2>Manual Backup</h2>
    <p>{{ message }}</p>
    <a href="/home" class="btn">Go Back</a>
  </div>
</body>
</html>
